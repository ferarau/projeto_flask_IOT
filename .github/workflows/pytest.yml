name: Executar Testes PyTest

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar Dependências
        run: |
          pip install -r requirements.txt
      - name: Rodar PyTest
        run: |
          pytest